name: Windows PyInstaller

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSYS2 (Toolshed / decb.exe)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make git

      - name: Build Toolshed decb.exe
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p vendor/windows/tools
          git clone --depth 1 https://github.com/nitros9project/toolshed.git /tmp/toolshed
          cd /tmp/toolshed/build/unix
          make CC=gcc WIN=1 \
            DIRS="libtoolshed libnative libcecb librbf libcoco libdecb libmisc libsys decb" \
            all
          cp -f decb/decb.exe "$GITHUB_WORKSPACE/vendor/windows/tools/decb.exe"
          ls -la "$GITHUB_WORKSPACE/vendor/windows/tools/decb.exe"

      - name: Fetch XRoar + LWTOOLS
        shell: pwsh
        run: ./scripts/fetch_tools_windows.ps1

      - name: PyInstaller package
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoCoIDE-windows-x86_64
          path: dist/CoCoIDE-*-windows-x86_64.zip
          if-no-files-found: error

      - name: Attach zip to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CoCoIDE-*-windows-x86_64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach zip to latest release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/CoCoIDE-*-windows-x86_64.zip | Select-Object -First 1
          if (-not $zip) { throw "zip missing" }
          $tag = gh release list --limit 5 --json tagName --jq ".[0].tagName"
          if (-not $tag) { throw "No GitHub release to attach to" }
          Write-Host "Uploading $($zip.Name) to release $tag (replaces prior Windows zip if same name)"
          gh release upload $tag $zip.FullName --clobber
