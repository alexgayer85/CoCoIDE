name: Windows PyInstaller

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Windows tools (xroar, lwasm, decb)
        shell: pwsh
        run: ./scripts/fetch_tools_windows.ps1

      - name: PyInstaller package
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoCoIDE-windows-x86_64
          path: dist/CoCoIDE-*-windows-x86_64.zip
          if-no-files-found: error

      - name: Attach zip to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CoCoIDE-*-windows-x86_64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach zip to latest release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/CoCoIDE-*-windows-x86_64.zip | Select-Object -First 1
          if (-not $zip) { throw "zip missing" }
          $tag = gh release list --limit 5 --json tagName --jq ".[0].tagName"
          if (-not $tag) { throw "No GitHub release to attach to" }
          Write-Host "Uploading $($zip.Name) to release $tag"
          gh release upload $tag $zip.FullName --clobber
